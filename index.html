<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="매일의 운동 루틴을 기록하는 핏로그" />
    <title>핏로그 | 매일 운동 루틴</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="brand">FIT<span>LOG</span><i></i></div>
        <p class="hero-date" id="today-label"></p>
        <div class="hero-copy">
          <p class="eyebrow">TRAIN HARD · LIVE STRONG</p>
          <h1>오늘의 땀은<br /><em>내일의 자신감.</em></h1>
          <p>작은 루틴을 완성하며 더 강한 나를 만드세요.</p>
        </div>
        <div class="streak-card" aria-label="연속 운동 일수">
          <span>🔥</span><strong id="streak-count">0</strong><small>DAY STREAK</small>
        </div>
      </header>

      <section class="progress-panel" aria-label="오늘의 운동 진행률">
        <div class="progress-top"><span>DAILY MISSION</span><b id="progress-percent">0%</b></div>
        <div class="progress-number"><strong id="progress-text">0 / 0</strong><span>루틴 완료</span></div>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      </section>

      <section class="routine-section">
        <div class="section-title"><div><p class="eyebrow">TODAY'S WORKOUT</p><h2>오늘의 루틴</h2></div><button id="reset-btn" type="button">기록 초기화</button></div>
        <ul id="routine-list" class="routine-list" aria-live="polite"></ul>
      </section>

      <section class="add-section">
        <p class="eyebrow">MAKE IT YOURS</p><h2>나만의 운동 추가</h2>
        <form id="add-form" class="add-form">
          <input id="exercise-name" maxlength="40" required placeholder="운동 이름 (예: 플랭크)" aria-label="운동 이름" />
          <input id="exercise-detail" maxlength="40" placeholder="횟수 또는 시간 (예: 3세트 × 30초)" aria-label="운동 횟수 또는 시간" />
          <button type="submit">루틴 추가 <span>→</span></button>
        </form>
      </section>

      <section class="week-section">
        <div class="section-title"><div><p class="eyebrow">WEEKLY POWER</p><h2>이번 주 기록</h2></div><span id="week-summary" class="week-summary"></span></div>
        <div id="week-grid" class="week-grid" aria-label="주간 운동 기록"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
